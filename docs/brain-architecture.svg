<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc"><title id="title">Neo-EL-Graph cybersecurity intelligence brain</title><desc id="desc">Layered architecture from threat data ingestion through knowledge graph, reasoning, verification, learning, and visual output, with a controlled feedback loop.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#08111f"/><stop offset="1" stop-color="#14243a"/></linearGradient><linearGradient id="brain" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#0d4c55"/><stop offset="1" stop-color="#1c3a61"/></linearGradient><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5eead4"/></marker><style>.title{font:700 32px system-ui;fill:#e8f0ff}.sub{font:15px system-ui;fill:#91a4c1}.layer{fill:#101c2e;stroke:#304967;stroke-width:1.5}.heading{font:700 19px system-ui;fill:#e8f0ff}.body{font:14px system-ui;fill:#a9bdd8}.num{font:700 14px system-ui;fill:#5eead4}.line{stroke:#5eead4;stroke-width:2;fill:none;marker-end:url(#arrow)}.tiny{font:12px system-ui;fill:#91a4c1}</style></defs><rect width="1200" height="920" rx="26" fill="url(#bg)"/><text x="60" y="65" class="title">NEO-EL-GRAPH</text><text x="60" y="94" class="sub">Persistent cybersecurity intelligence brain · architecture v0.1</text><rect x="60" y="125" width="1080" height="86" rx="16" class="layer"/><text x="88" y="157" class="num">01 · OBSERVE</text><text x="88" y="184" class="heading">Threat intelligence inputs</text><text x="410" y="174" class="body">CVE advisories · Git repositories · dependency manifests · logs · threat reports</text><path d="M600 211 V242" class="line"/><rect x="60" y="247" width="1080" height="86" rx="16" class="layer"/><text x="88" y="279" class="num">02 · NORMALIZE</text><text x="88" y="306" class="heading">Entity extraction + provenance</text><text x="410" y="296" class="body">Typed facts · source URLs · timestamps · confidence · verification status</text><path d="M600 333 V364" class="line"/><rect x="60" y="369" width="1080" height="112" rx="16" fill="url(#brain)" stroke="#2dd4bf" stroke-width="2"/><text x="88" y="402" class="num">03 · REMEMBER</text><text x="88" y="431" class="heading">Persistent knowledge graph</text><text x="410" y="413" class="body">Repository ↔ Package ↔ Vulnerability ↔ Technique ↔ Evidence</text><text x="410" y="441" class="body">SQLite starter → Neo4j graph adapter · temporal history · typed edges</text><path d="M600 481 V512" class="line"/><rect x="60" y="517" width="520" height="112" rx="16" class="layer"/><text x="88" y="550" class="num">04A · DISCOVER</text><text x="88" y="579" class="heading">Graph retrieval + reasoning</text><text x="88" y="605" class="body">Find paths · rank hypotheses · detect gaps</text><rect x="620" y="517" width="520" height="112" rx="16" class="layer"/><text x="648" y="550" class="num">04B · VERIFY</text><text x="648" y="579" class="heading">Evidence and safety gate</text><text x="648" y="605" class="body">Check sources · isolate uncertainty · audit claims</text><path d="M320 629 V655 H600" class="line"/><path d="M880 629 V655 H600" class="line"/><rect x="60" y="660" width="1080" height="86" rx="16" class="layer"/><text x="88" y="692" class="num">05 · LEARN</text><text x="88" y="721" class="heading">Outcome memory + evaluation</text><text x="410" y="710" class="body">Feedback labels · error taxonomy · benchmark regression · controlled policy updates</text><path d="M600 746 V777" class="line"/><rect x="60" y="782" width="1080" height="70" rx="16" class="layer"/><text x="88" y="811" class="num">06 · EXPLAIN</text><text x="270" y="823" class="heading">Dashboard · API · evidence-backed reports · analyst review</text><path d="M1140 704 H1170 V414 H1140" class="line"/><text x="1020" y="696" class="tiny" text-anchor="end">measured feedback loop</text><text x="60" y="888" class="tiny">Safety rule: learned candidates remain untrusted until independently validated. Feedback recording is not model training.</text></svg>